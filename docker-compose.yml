version: '3'
services:
  nifi:
    image: apache/nifi:latest
    container_name: nifi-test
    ports:
      - "8080:8080"
    environment:
      - NIFI_WEB_HTTP_PORT=8080
      - NIFI_WEB_HTTP_HOST=0.0.0.0
      # Disabling single user auth for easier testing (NiFi 1.14+)
      - SINGLE_USER_CREDENTIALS_USERNAME=admin
      - SINGLE_USER_CREDENTIALS_PASSWORD=password12345
    volumes:
      - ./nifi-test:/opt/nifi/nifi-current/test-data
