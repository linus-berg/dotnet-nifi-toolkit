# Secure NiFi 2.x for local testing of NifiKit, with mutual TLS (client
# certificate) authentication. NiFi 2.x container images only serve HTTPS.
#
#   ./scripts/generate-test-certs.sh   # creates ./certs (CA, NiFi + client certs)
#   docker compose up -d               # NiFi at https://localhost:8443/nifi
#
# The client certificate (CN=nifikit-client) is NiFi's initial admin. To use it
# for Site-to-Site you still need an input port and the policies
# "retrieve site-to-site details" and "receive data via site-to-site"; the
# integration tests in NifiKit.Tests create these automatically.
services:
  nifi:
    image: apache/nifi:2.12.0
    container_name: nifi-test
    hostname: nifi
    ports:
      - "8443:8443"
    environment:
      - AUTH=tls
      - NIFI_WEB_HTTPS_PORT=8443
      - NIFI_WEB_PROXY_HOST=localhost:8443
      - KEYSTORE_PATH=/opt/certs/keystore.p12
      - KEYSTORE_TYPE=PKCS12
      - KEYSTORE_PASSWORD=nifikit-test-password
      - TRUSTSTORE_PATH=/opt/certs/truststore.p12
      - TRUSTSTORE_TYPE=PKCS12
      - TRUSTSTORE_PASSWORD=nifikit-test-password
      - INITIAL_ADMIN_IDENTITY=CN=nifikit-client
      - NIFI_SENSITIVE_PROPS_KEY=nifikit-test-sensitive-key
    volumes:
      - ./certs:/opt/certs:ro,z
      - ./nifi-test:/opt/nifi/nifi-current/test-data:z
