name: Publish to NuGet

on:
  push:
    tags:
      - 'v*' # Push events to matching v*, i.e. v1.0, v20.15.10

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # lets NuGet/login request a GitHub OIDC token (trusted publishing)
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Determine version
        # Extract version from tag (e.g., refs/tags/v1.2.3 -> 1.2.3)
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_ENV"

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        # Version at build time so AssemblyVersion/FileVersion match the package
        run: dotnet build --no-restore -c Release -p:Version=$VERSION

      - name: Test
        run: dotnet test --no-build -c Release

      - name: Pack
        run: dotnet pack NifiKit/NifiKit.csproj --no-build -c Release -o out -p:Version=$VERSION

      # Trusted publishing: exchange the OIDC token for a short-lived API key.
      # Requires a trusted publishing policy on nuget.org for this repository
      # and workflow file (publish.yml).
      - name: NuGet login
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: LinusBerg # nuget.org username (profile name) owning the policy

      - name: Push to NuGet
        run: dotnet nuget push out/*.nupkg -s https://api.nuget.org/v3/index.json -k ${{ steps.nuget-login.outputs.NUGET_API_KEY }} --skip-duplicate
